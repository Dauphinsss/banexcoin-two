name: banex-reintegra

services:
  postgres:
    image: postgres:16-alpine
    container_name: banex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banex_reintegra
      POSTGRES_USER: banex
      POSTGRES_PASSWORD: banex_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banex -d banex_reintegra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: banex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
    name: banex_postgres_data
  redis_data:
    name: banex_redis_data
