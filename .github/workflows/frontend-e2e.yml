name: Frontend E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build shared packages
        run: bun run build:shared

      - name: Typecheck frontend
        run: bun run --cwd frontend typecheck

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run frontend e2e tests
        run: bun run --cwd frontend test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  fullstack:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./playwright.db
      NODE_ENV: test
      CORS_ORIGIN: http://127.0.0.1:4321
      PUBLIC_API_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare workspace and database
        run: bun run db:generate && bun run build:shared && bun run db:push && bun run db:seed

      - name: Typecheck frontend
        run: bun run --cwd frontend typecheck

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start backend
        run: bun run --cwd backend start > backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            curl --fail http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Run frontend fullstack e2e
        run: bun run --cwd frontend test:e2e:fullstack

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fullstack-report
          path: frontend/playwright-report/
          retention-days: 7
